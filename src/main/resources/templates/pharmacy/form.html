<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header pharmacy-hero">
            <h1><i class='bx bxs-capsule mr-1'></i> <span th:text="${medicine.id != null} ? 'Edit Medicine' : 'Add Medicine'">New Medicine</span></h1>
            <div class="page-actions"><a th:href="@{/pharmacy}" class="btn btn-outline"><i class='bx bx-arrow-back'></i> Back</a></div>
        </div>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/pharmacy/save}" th:object="${medicine}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-row">
                        <div class="form-group"><label>Medicine Name *</label><input type="text" th:field="*{name}" class="form-control" required></div>
                        <div class="form-group"><label>Generic Name</label><input type="text" th:field="*{genericName}" class="form-control"></div>
                        <div class="form-group"><label>Category *</label>
                            <select th:field="*{category}" class="form-control" required>
                                <option value="">Select</option>
                                <option value="Tablet">Tablet</option><option value="Capsule">Capsule</option>
                                <option value="Syrup">Syrup</option><option value="Injection">Injection</option>
                                <option value="Ointment">Ointment</option><option value="Drops">Drops</option>
                                <option value="Inhaler">Inhaler</option><option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Manufacturer</label><input type="text" th:field="*{manufacturer}" class="form-control"></div>
                        <div class="form-group"><label>Price (₹) *</label><input type="number" step="0.01" th:field="*{price}" class="form-control" required></div>
                        <div class="form-group"><label>Batch Number</label><input type="text" th:field="*{batchNumber}" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Stock Quantity *</label><input type="number" th:field="*{stockQuantity}" class="form-control" required></div>
                        <div class="form-group"><label>Reorder Level</label><input type="number" th:field="*{reorderLevel}" class="form-control"></div>
                    </div>
                    <div class="form-group"><label>Description</label><textarea th:field="*{description}" class="form-control" rows="2"></textarea></div>
                    <div style="display:flex; gap:12px;">
                        <button type="submit" class="btn btn-primary"><i class='bx bx-save'></i> <span th:text="${medicine.id != null} ? 'Update' : 'Save'">Save</span></button>
                        <a th:href="@{/pharmacy}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
