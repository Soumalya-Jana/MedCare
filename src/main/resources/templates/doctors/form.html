<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header doctor-hero">
            <h1><i class='bx bxs-user-badge mr-1'></i> <span th:text="${doctor.id != null} ? 'Edit Doctor' : 'Add New Doctor'">New Doctor</span></h1>
            <div class="page-actions">
                <a th:href="@{/doctors}" class="btn btn-outline"><i class='bx bx-arrow-back'></i> Back</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <form th:action="@{/doctors/save}" th:object="${doctor}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="form-row">
                        <div class="form-group"><label>Full Name *</label><input type="text" th:field="*{fullName}" class="form-control" required></div>
                        <div class="form-group"><label>Specialization *</label>
                            <select th:field="*{specialization}" class="form-control" required>
                                <option value="">Select</option>
                                <option value="Cardiology">Cardiology</option><option value="Pediatrics">Pediatrics</option>
                                <option value="Orthopedics">Orthopedics</option><option value="Neurology">Neurology</option>
                                <option value="Dermatology">Dermatology</option><option value="ENT">ENT</option>
                                <option value="Ophthalmology">Ophthalmology</option><option value="General Medicine">General Medicine</option>
                                <option value="Surgery">Surgery</option><option value="Gynecology">Gynecology</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Qualification</label><input type="text" th:field="*{qualification}" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Gender *</label>
                            <select th:field="*{gender}" class="form-control" required>
                                <option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Phone</label><input type="tel" th:field="*{phone}" class="form-control"></div>
                        <div class="form-group"><label>Email</label><input type="email" th:field="*{email}" class="form-control"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Consultation Fee (₹) *</label><input type="number" th:field="*{consultationFee}" class="form-control" required></div>
                        <div class="form-group"><label>Available Days</label><input type="text" th:field="*{availableDays}" class="form-control" placeholder="Mon,Tue,Wed,Thu,Fri"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Start Time</label><input type="time" th:field="*{availableTimeStart}" class="form-control"></div>
                        <div class="form-group"><label>End Time</label><input type="time" th:field="*{availableTimeEnd}" class="form-control"></div>
                        <div class="form-group"><label>Status</label>
                            <select th:field="*{status}" class="form-control">
                                <option value="Active">Active</option><option value="On Leave">On Leave</option><option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label>Address</label><textarea th:field="*{address}" class="form-control" rows="2"></textarea></div>
                    <div style="display:flex; gap:12px; margin-top:10px;">
                        <button type="submit" class="btn btn-primary"><i class='bx bx-save'></i> <span th:text="${doctor.id != null} ? 'Update' : 'Save'">Save</span></button>
                        <a th:href="@{/doctors}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
