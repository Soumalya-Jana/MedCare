<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Notice | MedCare HMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('hms-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-body); position:relative;">
    <div class="ambient-mesh" aria-hidden="true"></div>

    <div class="card" style="max-width: 520px; width:92%; text-align:center; padding:44px 36px; border-radius:var(--radius-xl); box-shadow:var(--shadow-md); position:relative; z-index:2;">
        <div style="font-size: 64px; color: var(--warning); line-height: 1; margin-bottom: 16px;">
            <i class='bx bx-error-circle'></i>
        </div>
        <h1 style="font-size: 1.75rem; font-weight:700; color:var(--text-primary); margin-bottom: 8px;">
            <span th:if="${status != null and status == 404}">Page or Record Not Found</span>
            <span th:unless="${status != null and status == 404}">Clinical System Notice</span>
        </h1>
        <p class="text-secondary" style="margin-bottom: 24px; font-size: 14.5px; line-height:1.5;">
            <span th:if="${message != null}" th:text="${message}">The requested clinical record or page could not be located in the hospital database.</span>
            <span th:unless="${message != null}">The requested record or page may have been moved, discharged, or does not exist.</span>
        </p>

        <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class='bx bx-home'></i> Return to Dashboard
            </a>
            <button type="button" class="btn btn-outline" onclick="window.history.back()">
                <i class='bx bx-arrow-back'></i> Go Back
            </button>
        </div>
    </div>
</body>
</html>
