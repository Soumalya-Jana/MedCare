<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | MedCare HMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="card" style="max-width: 480px; width:90%; text-align:center; padding:40px 30px; border-color: rgba(239, 68, 68, 0.3);">
        <div style="font-size: 64px; color: var(--danger); line-height: 1; margin-bottom: 16px;">
            <i class='bx bx-shield-x'></i>
        </div>
        <h1 style="font-size: 1.8rem; margin-bottom: 8px;">Access Denied</h1>
        <p class="text-muted" style="margin-bottom: 24px; font-size: 14px;">
            You do not have permission or sufficient security clearance to access this resource or administrative section.
        </p>

        <div style="display:flex; justify-content:center; gap:12px;">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class='bx bx-home'></i> Return to Dashboard
            </a>
            <a th:href="@{/logout}" class="btn btn-outline">
                <i class='bx bx-log-out'></i> Switch Account
            </a>
        </div>
    </div>
</body>
</html>
